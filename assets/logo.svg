<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48" fill="none">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e0af68" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
  </defs>
  <!-- Background Badge -->
  <rect x="4" y="4" width="40" height="40" rx="12" fill="#161922" stroke="rgba(255,255,255,0.08)" stroke-width="1.5" />
  <!-- Card outline subtle -->
  <rect x="11" y="14" width="26" height="20" rx="4" fill="none" stroke="url(#grad1)" stroke-width="2" />
  <!-- Card magnetic stripe / line -->
  <line x1="11" y1="20" x2="37" y2="20" stroke="rgba(99,102,241,0.3)" stroke-width="2" />
  <!-- Spark / Check / Gem -->
  <circle cx="30" cy="27" r="3" fill="url(#glow)" />
</svg>
